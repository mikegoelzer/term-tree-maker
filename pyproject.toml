[build-system]
requires = [
  "hatchling>=1.24", 
  "hatch-vcs>=0.4",
  "pytest>=7",
  "pytest-xdist>=3",
  "ruff>=0.6",
  "build>=1.0",
  "twine>=6.0",
]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"
fallback-version = "0.0.0"

[tool.hatch.version.vcs]
tag-pattern = "^term-tree-maker-v(?P<version>.+)$"

[tool.hatch.version.raw-options]
root = "."
relative_to = "pyproject.toml"
git_describe_command = "git describe --dirty --tags --long --match term-tree-maker-v*"

[tool.hatch.build.hooks.vcs]
version-file = "src/term_tree_maker/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/term_tree_maker"]

[tool.hatch.metadata]
allow-direct-references = true

[project]
name = "term-tree-maker"
requires-python = ">=3.10"
dynamic = ["version"]
description = "Tools for rendering Curv file/directory trees and generating terminal screenshots."
readme = "readme.md"
license = {text = "MIT"}
authors = [{name="Mike Goelzer"}]
classifiers = ["Programming Language :: Python :: 3 :: Only"]
dependencies = [
  "rich>=13",
  "python-dotenv>=1.1.0",
  "pillow>=10",
  "pytest>=7.4",
  "curvpyutils>=0.0.49",
  "curvtools>=0.0.17",
]

[project.optional-dependencies]
dev = [
    "curvpyutils @ file:///home/mwg/curv-python/packages/curvpyutils",
    "curvtools @ file:///home/mwg/curv-python/packages/curvtools",
]

[project.scripts]
term-tree-maker = "term_tree_maker.__main__:main"

[project.urls]
homepage = "https://github.com/mikegoelzer/term-tree-maker"
repository = "https://github.com/mikegoelzer/term-tree-maker"
documentation = "https://github.com/mikegoelzer/term-tree-maker/readme.md"
issues = "https://github.com/mikegoelzer/term-tree-maker/issues"


