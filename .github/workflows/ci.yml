name: CI
run-name: >-
  ${{ github.event_name == 'pull_request'
      && format('PR #{0}: {1}{2}',
                github.event.number,
                github.event.pull_request.title,
                github.event.head_commit && github.event.head_commit.message
                  ? format(' ({0})', github.event.head_commit.message)
                  : '')
      || github.event.head_commit && github.event.head_commit.message
      || github.ref_name }}

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Test (py${{ matrix.python }} • ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - uses: astral-sh/setup-uv@v4

      - name: Cache uv
        uses: actions/cache@v4
        with:
          path: ~/.cache/uv
          key: uv-${{ runner.os }}-${{ matrix.python }}-${{ hashFiles('pyproject.toml', 'uv.lock') }}

      - name: Sync dependencies
        run: uv sync --dev

      - name: Run pytest
        run: uv run pytest

